[app]
name        = "Orchestra"
env         = "development"
url         = "http://localhost:8080"
description = "Durable workflow engine with Go at the repo root and an embedded React UI."

[server]
host            = "0.0.0.0"
port            = 8080
readTimeout     = "15s"
writeTimeout    = "15s"
idleTimeout     = "60s"
shutdownTimeout = "10s"

[logging]
level  = "info"
format = "text"

[ui]
devProxyURL = "http://localhost:5173"

# ---------------------------------------------------------------------------
# AI providers — configure at least one to use AI-powered agents and the
# "Enhance with AI" feature in the agent editor.
#
# When an agent has no explicit provider set, Orchestra auto-selects the first
# configured provider in preference order: openai → copilot → claude.
# ---------------------------------------------------------------------------
[ai]

# --- OpenAI ---
# openaiAPIKey = ""    # set via APP_AI_OPENAI_API_KEY env var or here
# openaiBaseURL = ""   # optional: override for proxies / Azure OpenAI

# --- Anthropic Claude ---
# claudeAPIKey = ""    # set via APP_AI_CLAUDE_API_KEY env var or here
# claudeBaseURL = ""   # optional: override for proxies

# --- GitHub Copilot ---
# copilotOAuthToken = ""  # GitHub OAuth token (gho_...) — or APP_AI_COPILOT_OAUTH_TOKEN
# copilotBaseURL = ""     # optional: override completions base URL
# copilotTokenURL = ""    # optional: override token exchange URL
# The fields below have sensible defaults; only override if needed.
# copilotEditorVersion = "vscode/1.96.0"
# copilotEditorPluginVersion = "copilot/1.155.0"
# copilotIntegrationID = "vscode-chat"
# copilotOpenAIIntent = "conversation-panel"

[workflow]
enabled                 = true
# databaseDriver = "sqlite"      # "sqlite" (default) | "postgres"
databasePath            = "data/workflows.db"    # used when databaseDriver = "sqlite"
# databaseURL = "postgres://user:pass@localhost:5432/orchestra?sslmode=disable"
#                                # used when databaseDriver = "postgres"
#                                # also settable via APP_WORKFLOW_DATABASE_URL env var
#
# For PostgreSQL, tables are NOT created automatically.
# Run `orchestra schema --driver postgres --create` once after provisioning the database,
# or pipe the DDL to psql:
#   orchestra schema --driver postgres | psql "$DATABASE_URL"
# The --create flag is idempotent (ADD COLUMN IF NOT EXISTS) and safe to re-run.
pollInterval            = "1s"
leaseDuration           = "30s"
scriptEnabled           = false
scriptTimeout           = "250ms"
scriptMaxSourceBytes    = 16384
scriptMaxOutputBytes    = 262144
scriptMaxExecutionSteps = 25000

[webhook]
enabled = true
# callbackAllowlist = [
#   "https://your-domain\\.example\\.com/.*",
#   "http://localhost:.*",
# ]
# Regex list of URLs allowed as X-Callback-URL on POST /ext/webhook/{id}/start
# An empty list (default) means no callback URLs are accepted.
# Set a single ".*" entry to allow any URL (dev/test only).

# External API endpoints (no authentication — plan auth separately):
#   POST /ext/webhook/{definitionId}/start   — trigger a workflow (body = JSON input)
#   POST /ext/webhook/{workflowId}/signal    — deliver a named signal
#   GET  /ext/signal/{workflowId}            — poll workflow state / pending signals
#   GET  /ext/result/{workflowId}            — poll final result (202 while running)
